name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (project-page base path, static mode)
        env:
          VITE_BASE: /Tally/
          VITE_STATIC: "1"
          # 静态站没有服务端：密钥在构建时注入前端包，浏览器直连模型接口。
          # 仓库设置 → Secrets → AI_API_KEY；留空则站点退回「预设分析可用」。
          VITE_AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
